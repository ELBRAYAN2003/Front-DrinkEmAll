# Stack de DrinkEmAll.
#
# Espera que los dos repositorios esten clonados como hermanos:
#   drinkemall/
#     Front-DrinkEmAll/deploy/   <- este archivo
#     Back-DrinkEmAll/
#
# Los limites de memoria no son decorativos: el VPS comparte RAM con un
# servidor de Minecraft que usa ~11 GB de los 15 GB. Sin topes, un pico de
# MySQL puede hacer que el kernel mate un proceso cualquiera.

name: drinkemall

services:
  db:
    image: ${REGISTRY:-docker.io/library}/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta definirla en .env}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta definirla en .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # Sin puertos publicados: la base solo se alcanza desde la red interna.
    mem_limit: 640m

  api:
    build:
      context: ../../Back-DrinkEmAll
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta definirla en .env}
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta definirla en .env}
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: https://drinkemall.sbcorp.site
      IVA_PERCENTAGE: 21
      LOW_STOCK_THRESHOLD: 10
      # Caddy es un unico salto delante de la API: sin esto el limite de intentos de
      # ingreso cuenta a todos los visitantes como una sola IP (la del proxy).
      TRUST_PROXY: 1
      # Tienda online. Los de envio son PROVISORIOS hasta que el comercio los confirme;
      # el vendedor y los datos de transferencia/retiro se definen en .env (sin valor,
      # el pedido online responde 503 o muestra el dato como pendiente).
      ONLINE_SELLER_EMAIL: ${ONLINE_SELLER_EMAIL:-}
      SHIPPING_COST: ${SHIPPING_COST:-3000}
      FREE_SHIPPING_FROM: ${FREE_SHIPPING_FROM:-40000}
      PICKUP_ADDRESS: ${PICKUP_ADDRESS:-}
      PICKUP_HOURS: ${PICKUP_HOURS:-}
      DELIVERY_ZONE: ${DELIVERY_ZONE:-Juan José Castelli y localidades cercanas}
      TRANSFER_ALIAS: ${TRANSFER_ALIAS:-}
      TRANSFER_CBU: ${TRANSFER_CBU:-}
      TRANSFER_HOLDER: ${TRANSFER_HOLDER:-}
      TRANSFER_CUIT: ${TRANSFER_CUIT:-}
      TRANSFER_INSTRUCTIONS: ${TRANSFER_INSTRUCTIONS:-}
      # Minutos que se reserva el stock mientras se espera un pago por adelantado.
      PAYMENT_WINDOW_MINUTES: ${PAYMENT_WINDOW_MINUTES:-180}
      # Cuentas del comercio. Los seeders las crean una vez; sin contraseña no se crean.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@drinkemall.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VENDEDOR_EMAIL: ${VENDEDOR_EMAIL:-}
      VENDEDOR_PASSWORD: ${VENDEDOR_PASSWORD:-}
      # Adonde vuelve la persona despues de pagar y donde Mercado Pago avisa los pagos.
      FRONT_URL: https://drinkemall.sbcorp.site
      PUBLIC_API_URL: https://drinkemall.sbcorp.site
      # Mercado Pago (Checkout Pro). Sin MERCADOPAGO_ACCESS_TOKEN la opcion no se ofrece.
      # El secreto del webhook es obligatorio en produccion cuando hay token.
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_SANDBOX: ${MERCADOPAGO_SANDBOX:-false}
      MERCADOPAGO_PREFILL_PAYER_EMAIL: ${MERCADOPAGO_PREFILL_PAYER_EMAIL:-false}
      # Solo en el primer arranque; despues se deja en false.
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      - uploads:/app/uploads
    mem_limit: 448m

  web:
    build:
      context: ..
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
        VITE_API_URL: /api
        VITE_API_FILES: ""
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    mem_limit: 160m

volumes:
  dbdata:
  uploads:
  caddy_data:
  caddy_config:
  caddy_logs:
